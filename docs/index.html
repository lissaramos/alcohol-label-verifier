<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Label Verifier</title>
  <link rel="stylesheet" href="style.css?v=5" />
</head>
<body>
  <header>
    <div class="brand">
      <span class="brand-mark">◆</span>
      <h1>Label Verifier</h1>
    </div>
    <div class="api-config">
      <label for="apiBase">API base URL</label>
      <input id="apiBase" type="text" placeholder="http://localhost:8000" />
      <button id="saveApiBase" class="btn btn-ghost">Save</button>
      <span id="apiStatus" class="status"></span>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>1. Add a label to verify</h2>
      <p class="hint">Enter what was submitted on the application, and upload a photo of the label. The government warning is checked automatically — no need to enter it.</p>

      <form id="addForm" class="add-form">
        <label class="file-drop" for="fileInput">
          <span id="fileDropText">Choose a label photo, or drop it here</span>
        </label>
        <input id="fileInput" type="file" accept="image/*" required hidden />

        <label class="beverage-type-label">Beverage type
          <select id="beverageType" class="beverage-type-select">
            <option value="distilled_spirits">Distilled spirits</option>
            <option value="wine">Wine</option>
            <option value="beer">Beer / malt beverage</option>
          </select>
        </label>

        <div class="field-grid">
          <label>Brand name
            <input id="brandName" type="text" required placeholder="e.g. Old Tom Distillery" />
          </label>
          <label>Class / type
            <input id="classType" type="text" required placeholder="e.g. Kentucky Straight Bourbon Whiskey" />
          </label>
          <label>
            <span id="alcoholContentLabel">Alcohol content</span>
            <input id="alcoholContent" type="text" required placeholder="e.g. 45% Alc./Vol. (90 Proof)" />
          </label>
          <label>Net contents
            <input id="netContents" type="text" required placeholder="e.g. 750 mL" />
          </label>
        </div>

        <button type="submit" class="btn btn-secondary">Add to queue</button>
      </form>

      <div id="queueWrap" class="hidden">
        <h3>Queue (<span id="queueCount">0</span>)</h3>
        <ul id="queueList" class="queue-list"></ul>
        <button id="verifyAllBtn" class="btn btn-primary verify-all-btn">Verify all</button>
      </div>
    </section>

    <section class="panel">
      <h2>2. Results</h2>
      <div id="resultsEmpty" class="empty-state">
        <span class="empty-icon">✅</span>
        <p>Verified applications will show up here</p>
      </div>
      <ul id="resultsList" class="results-list hidden"></ul>
    </section>
  </main>

  <div id="detailOverlay" class="overlay hidden">
    <div class="detail-modal">
      <button id="closeDetail" class="btn btn-ghost close-btn">Close</button>
      <div id="detailContent"></div>
    </div>
  </div>

  <script src="app.js?v=5"></script>
</body>
</html>
